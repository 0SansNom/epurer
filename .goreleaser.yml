# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: epurer

# Keep goreleaser out of dist/, which holds Épurer.app and Epurer.dmg.
dist: build/goreleaser

before:
  hooks:
    - go mod tidy
    - go mod download

builds:
  - main: ./cmd/epurer
    binary: epurer
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/0SansNom/epurer/internal/version.Version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - Makefile

release:
  extra_files:
    - glob: ./dist/Epurer.dmg

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

brews:
  - name: epurer
    homepage: https://github.com/0SansNom/epurer
    description: "Intelligent developer cache cleaner for macOS"
    license: MIT
    repository:
      owner: 0SansNom
      name: homebrew-tap
      branch: main
    directory: Formula
    install: |
      bin.install "epurer"
    test: |
      system "#{bin}/epurer", "--version"
